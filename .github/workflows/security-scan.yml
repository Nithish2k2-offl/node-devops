name: Infrastructure Security Scan

on:
  push:
    paths:
      - 'terraform/**'
      - '.github/workflows/security-scan.yml'
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/security-scan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12 # Executes Checkov security scanning.
        with:
          directory: terraform/
          framework: terraform
          soft_fail: false

  opa-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Terraform parser
        run: pip install python-hcl2

      - name: Setup OPA
        uses: open-policy-agent/setup-opa@v2

      - name: Convert Terraform to JSON
        run: python scripts/terraform_to_json.py

      - name: Evaluate custom policies
        run: |
          opa eval \
            --data policies/security.rego \
            --input terraform-input.json \
            --format pretty \
            --fail-defined \
            "data.security.deny"
