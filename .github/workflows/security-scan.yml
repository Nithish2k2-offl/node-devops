name: Infrastructure Security Scan

on:
  push:
    paths:
      - 'terraform/**'
      - '.github/workflows/security-scan.yml'
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/security-scan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          soft_fail: false
